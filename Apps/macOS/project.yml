# XcodeGen spec for the macOS app.
#
# Run `xcodegen` here, or `make macos-project` from the repository root. The generated
# .xcodeproj is gitignored — edit this file, not the project.

name: VocalisBook
options:
  bundleIdPrefix: se.kladhest.vocalisbook
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

configs:
  Debug: debug
  Release: release

packages:
  PlexKit:
    path: ../../Core/PlexKit
  Audiobooks:
    path: ../../Core/Audiobooks
  Platform:
    path: ../../Platform/macOS
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.0.0

targets:
  VocalisBook:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
          # Referenced by CODE_SIGN_ENTITLEMENTS, not compiled or copied.
          - VocalisBook.entitlements
    dependencies:
      - package: PlexKit
      - package: Audiobooks
      - package: Platform
      - package: GRDB
        product: GRDB
    settings:
      # The checked-in Info.plist, used as written.
      #
      # NOT XcodeGen's `info:` key: that *generates* the file it points at, so
      # the hand-written one was overwritten on every `xcodegen` run and every
      # key in it silently disappeared. On iOS that meant no UILaunchScreen,
      # which makes iOS run the app letterboxed in compatibility mode — the app
      # sat in a band with black above and below no matter what the views did.
      # It also meant no UIBackgroundModes, so audio stopped on lock.
      #
      # Exactly the same trap as `entitlements:`, found and fixed there, and not
      # checked for here.
      INFOPLIST_FILE: Sources/Info.plist
      # The checked-in entitlements, used as written — same trap as the plist.
      #
      # NOT XcodeGen's `entitlements:` key: that generates the file it points at,
      # so a hand-written one is overwritten with an empty dict.
      CODE_SIGN_ENTITLEMENTS: Sources/VocalisBook.entitlements
    configFiles:
      Debug: ../../Config/macOS.xcconfig
      Release: ../../Config/macOS.xcconfig
    # No `entitlements:` key here on purpose.
    #
    # XcodeGen *generates* the file that key points at, so a hand-written
    # entitlements file next to it gets overwritten with an empty dict — while
    # ENABLE_APP_SANDBOX in the xcconfig still switches sandboxing on. The app
    # then launches sandboxed with no network permission, every request fails,
    # and sign-in reports a transport error with no explanation.
    #
    # The sandbox and its exceptions are declared once, as build settings, in
    # ../../Config/macOS.xcconfig. Xcode synthesises the entitlements from those.
    # Info.plist is checked in rather than generated here — the local-network and
    # ATS keys need comments explaining why a homelab server on plain HTTP is
    # permitted, and generated plists lose them.

  # Without a test target the generated scheme has no test action, and
  # `xcodebuild test` fails with "Scheme VocalisBook is not currently configured
  # for the test action" — which reads like a broken app and is not.
  VocalisBookTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      # The Platform package, not the app.
      #
      # Depending on the app target makes this a hosted test bundle, so running
      # it launches VocalisBook — which under ad-hoc test signing has no iCloud
      # entitlement, and creating a CKContainer without one ends the process
      # before any test runs. `make test` failed with "the test runner crashed
      # before establishing connection", which names the symptom and not this.
      #
      # Nothing here needs the app. What it tests lives in Platform.
      - package: Platform
    settings:
      GENERATE_INFOPLIST_FILE: YES

# Declared explicitly rather than left to XcodeGen's default, so the test action
# is part of the checked-in spec and cannot quietly go missing.
schemes:
  VocalisBook:
    build:
      targets:
        VocalisBook: all
        VocalisBookTests: [test]
    test:
      targets:
        - VocalisBookTests
      gatherCoverageData: false
    run:
      config: Debug
