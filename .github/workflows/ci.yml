name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Release tooling (offline)
        run: make release-tests
      - name: Platform drift
        run: make drift
      - name: Core and shared tests
        run: make core
      - name: Mac platform tests
        working-directory: Platform/macOS
        run: swift test
  apps:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: generic/platform=iOS Simulator
          - platform: tvOS
            destination: generic/platform=tvOS Simulator
          - platform: macOS
            destination: platform=macOS
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec Apps/${{ matrix.platform }}/project.yml
      - name: Build unsigned app
        run: >-
          xcodebuild build
          -project Apps/${{ matrix.platform }}/VocalisBook.xcodeproj
          -scheme VocalisBook
          -destination '${{ matrix.destination }}'
          CODE_SIGNING_ALLOWED=NO
